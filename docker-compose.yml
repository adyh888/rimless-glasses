services:
  qingtou:
    build:
      context: .
      dockerfile: Dockerfile
    image: qingtou-vision:latest
    container_name: qingtou-vision
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口；如 3000 被占用改成 8080:3000 即可
      - "3000:3000"
    volumes:
      # SQLite 数据库持久化
      - ./data:/app/data
      # 后台上传的图片持久化
      - ./uploads:/app/uploads
    environment:
      # 强烈建议覆盖：随机长字符串，泄漏后所有 JWT 失效
      NUXT_JWT_SECRET: ${NUXT_JWT_SECRET:-please-change-me-to-a-long-random-string}
      # 站点名（前台 header / footer 等地方读取）
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:-清透视界}
